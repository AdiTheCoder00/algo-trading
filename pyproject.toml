[project]
name = "algo"
version = "0.1.0"
description = "Short-strangle trading engine for MCX GOLDM options"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "structlog>=24.1",
    "PyYAML>=6.0",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "smartapi-python>=1.5.5",
    "kotakneoapi==3.0.1",
    "pyotp>=2.9",
    # The SmartAPI SDK does not declare its own dependencies.
    "logzero>=1.7",
    "websocket-client>=1.8",
    "openpyxl>=3.1",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.4",
    "pandas-stubs",
    "types-PyYAML",
    # starlette's TestClient moved to httpx2 and warns when it falls back to
    # httpx. filterwarnings=error turns that into a collection failure, so the
    # transport it actually wants is declared rather than inherited by luck.
    "httpx2",
]

[project.scripts]
algo = "algo.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["algo*"]

[tool.setuptools.package-data]
algo = ["exchange/data/*.yaml"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

# ---------------------------------------------------------------- mypy
# Brief §3: mypy --strict on core modules.
[tool.mypy]
# No python_version pin: it is checked against whichever interpreter is running,
# because numpy ships stubs that use 3.12 `type` syntax and a 3.11 pin makes mypy
# fail inside site-packages before it reaches our code. The package itself still
# targets 3.11+ (requires-python above) and uses nothing newer.
strict = true
warn_unreachable = true
disallow_any_explicit = false
show_error_codes = true
files = ["algo", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The Angel One and Kotak Neo SDKs ship no usable type information (kotakneoapi
# ships py.typed without stubs, which makes mypy analyze it and flag its lazy
# exports at import sites); they are imported lazily behind our own typed
# transport boundaries and are not worth stubbing.
module = ["SmartApi.*", "neo_api_client.*", "logzero", "pyotp", "requests"]
ignore_missing_imports = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetime  <- §2.6
    "T20",       # no print()
    "SIM",       # simplify
    "RUF",
    "BLE",       # blind except    <- §12
    "TRY",       # exception antipatterns
]
ignore = [
    "TRY003",  # long messages in exceptions are the point here
    "TRY400",
    "RUF002",  # en dashes are deliberate typography in docstring prose
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately construct edge-case datetimes and assert on internals.
"tests/*" = ["DTZ001", "DTZ005", "S101"]
# The clock module is the ONE place allowed to read wall-clock time (D-015).
"algo/core/clock.py" = ["DTZ003", "DTZ005"]
# typer declares CLI arguments as call-valued defaults; that is its documented API.
"algo/cli/main.py" = ["B008"]
