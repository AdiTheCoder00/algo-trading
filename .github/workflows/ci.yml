# CI. Brief §11: "CI runs mypy --strict, ruff, and the full suite."
#
# Nothing here is allowed to be advisory. A type error, a lint finding or a failed
# test fails the build — a "warnings only" gate on a system that moves money is a
# gate that will eventually be stepped over.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

      # The greps the brief's §12 asks for, enforced rather than trusted. ruff
      # covers bare `except:` and naive datetimes; these three are project rules
      # it has no way to know about.
      - name: No wall-clock reads outside the clock module
        run: |
          if grep -rn --include=*.py -E "datetime\.now|datetime\.utcnow|time\.time\(\)" algo/ \
             | grep -v "algo/core/clock.py"; then
            echo "::error::wall-clock read outside algo/core/clock.py (decision D-015)"
            exit 1
          fi

      - name: No float construction in money paths
        run: |
          if grep -rn --include=*.py "float(" algo/core/money.py algo/portfolio/ algo/costs/; then
            echo "::error::float() in a money path (brief §2.5)"
            exit 1
          fi

      - name: No silent exception swallowing
        run: |
          if grep -rn --include=*.py -B1 -E "^\s+pass\s*$" algo/ | grep -E "except.*:"; then
            echo "::error::an exception is being swallowed (brief §12)"
            exit 1
          fi

      # Typer prints command docstrings as --help text, and Windows consoles
      # default to a legacy code page - an em dash there renders as a
      # replacement character and a rupee sign would raise. The CLI is a
      # terminal surface, so it stays ASCII. Prose elsewhere keeps its
      # typography.
      - name: CLI output is ASCII
        run: |
          if LC_ALL=C grep -n "[^[:print:][:space:]]" algo/cli/main.py; then
            echo "::error::non-ASCII in algo/cli/main.py mangles on a cp1252 console"
            exit 1
          fi

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Build
        run: npx next build

      - name: Audit
        run: npm audit --omit=dev --audit-level=moderate
