org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation fails on this machine with
#   "Could not close incremental caches ... class-fq-name-to-source.tab"
# which is Windows file-locking on the .tab cache files (Defender or similar
# scanning the build tree mid-compile), not a code fault. Incremental
# compilation buys nothing in a clean one-shot release build, so it is off.
kotlin.incremental=false

# Keep the Kotlin compiler inside the Gradle daemon. The out-of-process daemon
# is the thing that was failing to release those cache file handles.
kotlin.compiler.execution.strategy=in-process
